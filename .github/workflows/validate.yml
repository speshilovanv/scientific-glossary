name: Validate ScientificGlossary
on:
  pull_request:
    types: [opened, reopened]
  push:
    branches: [main, 'release/**']
permissions:
  contents: read
jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract embedded JavaScript and check required UI
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          for term in ('id="pageJump"', 'id="qualityFilter"', 'id="reviewedCheckbox"', 'id="exportDocBtn"', 'id="pdfInput"'):
              assert term in page, f'Missing UI control: {term}'
          scripts=re.findall(r'<script>\s*([\s\S]*?)</script>',page)
          assert len(scripts)>=2, 'Expected embedded application and DOCX exporter'
          for n, script in enumerate(scripts):
              Path('/tmp/sg_script_'+str(n)+'.js').write_text(script)
          print('Static UI checks passed; extracted',len(scripts),'scripts')
          PY
          for script in /tmp/sg_script_*.js; do node --check "$script"; done
          node --check sw.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --omit=optional
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Cache published article corpus
        uses: actions/cache@v4
        with:
          path: qa-papers
          key: articles-v2-${{ hashFiles('tests/papers.json') }}
      - run: node tests/download-papers.mjs
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-results
          path: test-results/
